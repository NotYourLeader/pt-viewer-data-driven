<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--green:#1EA270;--green-dk:#137a51;--green-lt:#e6f7f1;--red:#F04E4F;--red-lt:#fff1f1;--line:#e2e8f0;--line-dk:#cbd5e1;--muted:#64748b;--bg:#f1f5f9;--ink:#0f172a;--ink-2:#334155;--card:#ffffff;--hdr:#0f172a;--radius:14px;--radius-sm:8px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--shadow-md:0 4px 20px rgba(15,23,42,.12)}
body{margin:0;background:var(--bg);font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
header{background:var(--hdr);border-bottom:1px solid rgba(255,255,255,.07);padding:24px 34px}h1{margin:0 0 8px;font-size:27px;color:#f8fafc;font-weight:800}p{color:#94a3b8}
main{max-width:1420px;margin:22px auto;padding:0 20px 50px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;box-shadow:var(--shadow)}.panel>h2{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 16px;letter-spacing:-.1px;text-transform:uppercase;letter-spacing:.04em}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.metric{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:var(--radius);padding:20px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}.metric:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}.metric b{font-size:30px;display:block;line-height:1;font-weight:800;color:var(--green);letter-spacing:-.8px;word-break:break-word}.metric span{text-transform:uppercase;color:var(--muted);font-size:10.5px;letter-spacing:.07em;line-height:1.5;font-weight:600}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);max-height:760px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f0fdf8;z-index:2;text-transform:uppercase;font-size:11px;letter-spacing:.05em;font-weight:700;color:var(--ink-2)}tbody tr:hover td{background:#f8fcfa}td{color:var(--ink-2)}
.badge,.chip{display:inline-block;border-radius:6px;padding:3px 8px;margin:2px;border:1px solid transparent;font-weight:600;font-size:11.5px;letter-spacing:.01em}.cohort,.badge.cohort{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}.triple,.badge.triple{background:#dcfce7;color:#15803d;border-color:#bbf7d0}.same,.badge.same{background:#d1fae5;color:#065f46;border-color:#a7f3d0}.ins,.badge.ins{background:#f1f5f9;color:#334155;border-color:#e2e8f0}.crosscore,.badge.crosscore{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}.other,.badge.other{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.forced,.badge.forced{background:#fef3c7;color:#92400e;border-color:#fde68a}
.chip.maths{background:#d1fae5;color:#065f46}.chip.english{background:#dbeafe;color:#1d4ed8}.chip.science{background:#fef3c7;color:#92400e}.chip.ins{background:#f1f5f9;color:#334155}.chip.blocked{background:#0f172a;color:#f8fafc}.chip.other{background:#fee2e2;color:#b91c1c}
.ok{color:var(--green);font-weight:700}.warn{border-left:4px solid #d97706;background:#fffbeb;padding:14px 16px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.6}.note{border-left:4px solid var(--green);background:#f0fdf4;padding:14px 16px;border-radius:var(--radius-sm);margin-top:10px;font-size:13.5px;line-height:1.6}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.day{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px;transition:box-shadow .15s}.day:hover{box-shadow:var(--shadow-md)}.session{padding:9px 10px;border-radius:8px;margin:6px 0;border:1px solid var(--line);background:var(--card)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}select{padding:8px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--card);font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,162,112,.12)}button{padding:8px 16px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--card);font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s}button:hover{background:var(--green-lt);border-color:var(--green);color:var(--green)}.class-view,.teacher-view{display:none}.class-view.active,.teacher-view.active{display:block}
.testevent td{background:#f0fdf8!important}.relocateevent td{background:#fffbeb!important}.usedevent td{background:#eff6ff!important}

.timeline-help{margin-top:-4px;margin-bottom:14px}.timeline-grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card)}.timeline-matrix{min-width:1320px;width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}.timeline-matrix th,.timeline-matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;vertical-align:top}.timeline-matrix thead th{position:sticky;top:0;background:#f0fdf8;z-index:3;text-align:center}.timeline-matrix .day-head{left:0;z-index:5}.timeline-matrix .day-label{position:sticky;left:0;background:var(--bg);z-index:2;width:110px;min-width:110px;font-size:13px;color:var(--ink-2)}.timeline-cell{min-height:96px;background:var(--card)}.timeline-cell.active-cell{background:#f8fcfa}.timeline-cell.concurrent-cell{background:#fffbeb;box-shadow:inset 0 0 0 2px #fbbf24}.period-count{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;color:#92400e;background:#fef3c7;border:1px solid #fde68a;border-radius:999px;padding:3px 7px;margin-bottom:5px}.timeline-chip{display:block;border-radius:8px;padding:6px 7px;margin:0 0 5px;border:1px solid var(--line);font-weight:600;line-height:1.2}.timeline-chip b{display:block;font-size:12px}.timeline-chip small{display:block;margin-top:3px;font-size:10.5px;font-weight:500;color:#344054}.timeline-chip.cohort{background:#e0f2fe;color:#075985;border-color:#7dd3fc}.timeline-chip.triple{background:#e7f8ef;color:#057647;border-color:#abefc6}.timeline-chip.same{background:#eefbf5;color:#057647}.timeline-chip.ins{background:#f2f4f7;color:#344054}.timeline-chip.crosscore{background:#eef4ff;color:#174a86}.timeline-chip.other{background:#fff1f1;color:#b42318}.timeline-chip.forced{background:#fff8eb;color:#8a6100;border-color:#f2c94c}.empty-slot{color:#98a2b3}.concurrent-wrap{max-height:420px}.concurrent-table td:nth-child(3),.concurrent-table th:nth-child(3){text-align:center}


.timeline-span-panel .timeline-help{margin-top:-4px;margin-bottom:10px}.span-legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.legend-item{background:#f9fafb;border:1px solid #eaecf0;border-radius:999px;padding:6px 10px;color:#344054;font-size:12px}.span-timeline-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.span-timeline{min-width:1320px;width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}.span-timeline th,.span-timeline td{border-right:1px solid #eaecf0;border-bottom:1px solid #eaecf0;padding:6px;vertical-align:middle}.span-timeline thead th{position:sticky;top:0;background:#f3faf7;z-index:4;text-align:center;height:34px}.span-timeline .span-day-head{left:0;z-index:6}.span-day-label{position:sticky;left:0;background:#f9fafb;z-index:3;width:120px;min-width:120px;font-size:13px;color:#17211f;text-transform:uppercase;vertical-align:top}.lane-row{height:58px}.span-empty{background:#fff;min-height:48px}.session-span{background:#fbfffd;padding:4px}.session-span.overlap-span{background:#fff8eb;box-shadow:inset 0 0 0 2px #f2c94c}.span-chip{border-radius:10px;padding:7px 8px;border:1px solid #ddd;font-weight:700;line-height:1.2;min-height:36px;display:flex;flex-direction:column;justify-content:center}.span-chip-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.span-chip-top b{font-size:12.5px}.span-chip-top span{font-size:11px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.65);border-radius:999px;padding:2px 6px;white-space:nowrap}.span-chip small{display:block;margin-top:3px;font-size:11px;font-weight:500;color:#344054}.span-chip.cohort{background:#e0f2fe;color:#075985;border-color:#7dd3fc}.span-chip.triple{background:#e7f8ef;color:#057647;border-color:#abefc6}.span-chip.same{background:#eefbf5;color:#057647}.span-chip.ins{background:#f2f4f7;color:#344054}.span-chip.crosscore{background:#eef4ff;color:#174a86}.span-chip.other{background:#fff1f1;color:#b42318}.span-chip.forced{background:#fff8eb;color:#8a6100;border-color:#f2c94c}.concurrent-wrap{max-height:420px}.concurrent-table td:nth-child(3),.concurrent-table th:nth-child(3){text-align:center}

@media print{body{background:#fff}.panel{box-shadow:none}.tablewrap{max-height:none;overflow:visible}.days{grid-template-columns:1fr}.controls{display:none}}


.teacher-timeline-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
.teacher-timeline{min-width:1180px;width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.teacher-timeline th,.teacher-timeline td{border-right:1px solid #eaecf0;border-bottom:1px solid #eaecf0;padding:8px;vertical-align:top}
.teacher-timeline thead th{position:sticky;top:0;background:#f3faf7;z-index:3;text-align:center;text-transform:uppercase;font-size:12px;color:#344054}
.teacher-timeline .day-col-head{width:120px;min-width:120px;position:sticky;left:0;z-index:4}
.teacher-timeline .day-label{position:sticky;left:0;z-index:2;width:120px;min-width:120px;font-size:13px;font-weight:700;color:#17211f;text-transform:uppercase}
.teacher-timeline tr.day-alt-a .day-label,.teacher-timeline tr.day-alt-a td{background:#fcfcfd}
.teacher-timeline tr.day-alt-b .day-label,.teacher-timeline tr.day-alt-b td{background:#f8fafb}
.teacher-timeline td.empty{background:transparent;padding:0;height:14px}
.teacher-timeline .block-cell{padding:6px;background:transparent}
.teacher-block{display:block;border-radius:10px;padding:7px 8px;border:1px solid #ddd;font-weight:700;line-height:1.22;box-shadow:0 1px 1px rgba(16,24,40,.04)}
.teacher-block .block-title{display:block;font-size:12px;font-weight:700}
.teacher-block .teacher-line{display:block;margin-top:3px;font-size:11px;font-weight:600;opacity:.92}
.teacher-block .block-meta{display:block;margin-top:4px;font-size:10.5px;font-weight:500;color:#344054}
.teacher-block .block-note{display:block;margin-top:4px;font-size:10.5px;font-weight:500;color:#475467}
.teacher-block.testevent{background:#eefbf5;color:#057647;border-color:#abefc6}
.teacher-block.relocateevent{background:#fff8eb;color:#8a6100;border-color:#f2c94c}
.teacher-block.usedevent{background:#eef4ff;color:#174a86;border-color:#b2ccff}
.teacher-block.other-event{background:#f5f5f5;color:#344054;border-color:#d0d5dd}
.teacher-summary{margin:0 0 8px;color:#667085}
.teacher-view h3{margin-bottom:4px}


/* Stronger day banding across the main span timeline and teacher timelines */
.span-timeline tbody tr.day-alt-a > th,
.span-timeline tbody tr.day-alt-a > td,
.teacher-timeline tbody tr.day-alt-a > th,
.teacher-timeline tbody tr.day-alt-a > td{
  background:#f3f4f6;
}
.span-timeline tbody tr.day-alt-b > th,
.span-timeline tbody tr.day-alt-b > td,
.teacher-timeline tbody tr.day-alt-b > th,
.teacher-timeline tbody tr.day-alt-b > td{
  background:#e5e7eb;
}
.span-timeline tbody tr.day-alt-a > td.session-span,
.span-timeline tbody tr.day-alt-b > td.session-span,
.teacher-timeline tbody tr.day-alt-a > td.block-cell,
.teacher-timeline tbody tr.day-alt-b > td.block-cell{
  background:inherit;
}
.span-timeline tbody tr.day-alt-a > td.session-span.overlap-span,
.span-timeline tbody tr.day-alt-b > td.session-span.overlap-span{
  box-shadow:inset 0 0 0 2px #f2c94c;
}
.span-chip{
  min-height:54px;
}
.span-chip .session-teacher{
  display:block;
  margin-top:4px;
  font-size:11px;
  font-weight:700;
  color:#344054;
}
.span-chip.has-flag,
.teacher-block.has-flag{
  outline:2px solid #b42318;
  outline-offset:1px;
}
.span-chip.has-flag.flag-cover,
.teacher-block.has-flag.flag-cover{
  outline-color:#174a86;
}
.span-chip.has-flag.flag-room,
.teacher-block.has-flag.flag-room{
  outline-color:#8a6100;
}
.flag-row td{
  background:#fff8eb !important;
}
.flag-badge{
  display:inline-block;
  margin-left:6px;
  padding:2px 6px;
  border-radius:999px;
  border:1px solid #b42318;
  background:#fff1f1;
  color:#b42318;
  font-size:10px;
  font-weight:800;
  letter-spacing:.02em;
  white-space:nowrap;
  vertical-align:middle;
}
.flag-badge.room{
  border-color:#8a6100;
  color:#8a6100;
  background:#fff8eb;
}
.flag-badge.auth{
  border-color:#b42318;
  color:#b42318;
  background:#fff1f1;
}
.flag-badge.cover,
.flag-badge.exception{
  border-color:#174a86;
  color:#174a86;
  background:#eef4ff;
}
.flag-note{
  display:block;
  margin-top:4px;
  font-size:10.5px;
  font-weight:700;
  color:#b42318;
}
.flag-note.room{color:#8a6100}
.flag-note.cover,.flag-note.exception{color:#174a86}
.flag-legend{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:10px 0 12px;
  color:#667085;
}
.flag-legend span{
  font-size:12px;
}


/* Day-separated timeline layout */
.day-timeline-list,
.teacher-day-timeline-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.day-timeline-card,
.teacher-day-card{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:auto;
  background:#fff;
}
.day-timeline-card.day-alt-a,
.teacher-day-card.day-alt-a{background:#f3f4f6}
.day-timeline-card.day-alt-b,
.teacher-day-card.day-alt-b{background:#e5e7eb}
.day-timeline-card h3,
.teacher-day-card h4{
  position:sticky;
  left:0;
  margin:0;
  padding:10px 12px;
  background:inherit;
  border-bottom:1px solid #d0d5dd;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.day-timeline-card table,
.teacher-day-card table{
  min-width:1200px;
  border:0;
  border-radius:0;
}
.day-timeline-card thead th,
.teacher-day-card thead th{
  position:sticky;
  top:0;
  z-index:3;
  text-align:center;
}
.day-timeline-card.day-alt-a thead th,
.teacher-day-card.day-alt-a thead th{background:#eef2f7}
.day-timeline-card.day-alt-b thead th,
.teacher-day-card.day-alt-b thead th{background:#d8dde5}
.day-timeline-card tbody tr > td,
.teacher-day-card tbody tr > td{
  background:transparent;
}
.review-panel table td:first-child{font-weight:700}
.review-status{
  display:inline-block;
  border-radius:999px;
  padding:3px 8px;
  font-weight:800;
  font-size:11px;
  border:1px solid #b42318;
  color:#b42318;
  background:#fff1f1;
}
.review-status.ok{
  border-color:#057647;
  color:#057647;
  background:#eefbf5;
}
.review-status.partial{
  border-color:#8a6100;
  color:#8a6100;
  background:#fff8eb;
}

.start-leader-line{
  display:block;
  margin-top:4px;
  font-size:11px;
  font-weight:800;
  color:#17211f;
}
.start-leader-cell{
  font-weight:800;
  color:#17211f;
}
.leader-block{
  background:#f4f3ff;
  color:#3b2f73;
  border-color:#c7bfff;
}
.leadership-panel table td:first-child{
  font-weight:700;
}
.leader-ok{
  color:#057647;
  font-weight:800;
}
.leader-warn{
  color:#8a6100;
  font-weight:800;
}
/* ===== Sort & Filter ===== */
.sf-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm)}
.sf-bar input{min-width:130px;padding:7px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;background:var(--card);font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.sf-bar input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,162,112,.12)}
.sf-bar select.sf-sel{min-width:130px;padding:7px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;background:var(--card);font-family:inherit;color:var(--ink);cursor:pointer;outline:none;transition:border-color .15s}
.sf-bar select.sf-sel:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,162,112,.12)}
.sf-bar button{padding:7px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;background:var(--card);font-family:inherit;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.sf-bar button:hover{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.sf-bar .sf-reset{color:var(--muted)}
.sf-bar label{font-size:11.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.sf-count{font-size:12px;color:var(--muted);white-space:nowrap;padding:4px 0;font-weight:500}
th.sort-th{cursor:pointer;user-select:none}
th.sort-th:hover{background:#e5f9f1!important}
th.sort-th::after{content:' ↕';font-size:10px;opacity:.35}
th.sort-th.asc::after{content:' ↑';opacity:1;color:#1EA270}
th.sort-th.desc::after{content:' ↓';opacity:1;color:#1EA270}

/* === Tabbed layout === */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
header{padding:12px 32px!important;display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--hdr)!important;border-bottom:1px solid rgba(255,255,255,.07)!important}
header h1{font-size:17px!important;margin:0!important;white-space:nowrap;color:#f1f5f9!important;font-weight:700!important;letter-spacing:-.2px}
header p{font-size:11.5px!important;margin:0!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;color:#94a3b8!important}
#tab-nav{position:sticky;top:0;z-index:300;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0 24px;box-shadow:0 2px 12px rgba(15,23,42,.06)}
#tab-nav::-webkit-scrollbar{height:3px}
#tab-nav::-webkit-scrollbar-thumb{background:var(--line-dk);border-radius:2px}
.tab-btn{flex-shrink:0;padding:12px 18px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px;font-family:inherit;transition:color .15s,border-color .15s,background .1s}
.tab-btn:hover{color:var(--ink);background:#f8faf9}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:tabIn .18s ease}
@keyframes tabIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
#tabp-0.active{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
#tabp-0.active .panel{margin-bottom:0}
#tabp-0.active .overview-cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
main{margin-top:8px!important}
@media(max-width:900px){#tabp-0.active{grid-template-columns:1fr}}
.evt-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.evt-btn{padding:5px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:var(--card);color:var(--muted);font-family:inherit;transition:background .12s,color .12s,border-color .12s}
.evt-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-lt)}
.evt-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

/* === Cover / Substitutions === */
.cover-panel .cover-metrics{margin:14px 0 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.coverevent td{background:#eefbf5!important}
.roommoveevent td{background:#eff6ff!important}

/* ---- additions for data-driven renderer ---- */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.filter-bar input[type=text],.filter-bar select{padding:7px 10px;border:1px solid var(--line-dk);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
.filter-bar input[type=text]{min-width:220px}
.filter-bar button{padding:7px 12px;border:1px solid var(--line-dk);background:#fff;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;color:var(--ink-2);font-family:inherit}
.filter-bar button:hover{background:#f1f5f9}
.filter-count{font-size:12px;color:var(--muted);margin-left:auto}
.cover-type-pill{display:inline-block;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--ink-2)}
.teacher-view,.class-view{display:none}
.teacher-view.active,.class-view.active{display:block}
.teacher-view h3,.class-view h3{font-size:15px;margin:6px 0 12px;color:var(--ink)}
.sort-th{cursor:pointer;user-select:none}
.sort-th.asc::after{content:" \2191";color:var(--green)}
.sort-th.desc::after{content:" \2193";color:var(--green)}
.load-error{background:var(--red-lt);border:1px solid var(--red);border-radius:var(--radius);padding:24px;color:#7f1d1d;line-height:1.6}
.load-error code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:.92em}
/* ---- collapsible day cards ---- */
details.day-timeline-card{overflow:visible}
.day-card-summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;position:sticky;left:0;padding:10px 12px;background:inherit;border-bottom:1px solid #d0d5dd;user-select:none}
.day-card-summary::-webkit-details-marker{display:none}
.day-card-summary::before{content:"\25B8";display:inline-block;font-size:12px;color:var(--muted);transition:transform .15s;flex:0 0 auto}
details[open] > .day-card-summary::before{transform:rotate(90deg)}
.day-card-summary h3{position:static;margin:0;padding:0;border:0;background:none;text-transform:uppercase;letter-spacing:.02em;font-size:14px}
.day-card-count{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-left:auto;padding-right:4px}
.day-card-body{overflow:auto}
details.day-timeline-card:not([open]){opacity:.72}
details.day-timeline-card.day-card-next{outline:2px solid var(--green);outline-offset:-1px;opacity:1}
.day-card-next .day-card-summary h3{color:var(--green-dk)}
.day-card-next .day-card-count::after{content:" \00B7 next testing day";color:var(--green-dk)}
